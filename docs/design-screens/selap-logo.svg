<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-labelledby="title desc">
  <title id="title">SELAP Building Emblem Logo</title>
  <desc id="desc">A bold SELAP logo with a circular building emblem and customized wordmark. SELAP means Smart Estate Leasing and Approval Platform.</desc>
  <defs>
    <linearGradient id="wordGradient" x1="218" y1="65" x2="560" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17252c"/>
      <stop offset="0.55" stop-color="#1d647b"/>
      <stop offset="1" stop-color="#319abd"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1d647b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="880" height="220" fill="none"/>

  <g transform="translate(28 22)" filter="url(#logoShadow)">
    <circle cx="88" cy="88" r="82" fill="#ffffff" stroke="#111111" stroke-width="8"/>
    <clipPath id="emblemClip">
      <circle cx="88" cy="88" r="76"/>
    </clipPath>

    <g clip-path="url(#emblemClip)">
      <path d="M28 146 H151" stroke="#111111" stroke-width="8" stroke-linecap="round"/>
      <path d="M40 156 H136" stroke="#111111" stroke-width="7" stroke-linecap="round"/>

      <path d="M45 70 L95 92 V146 H45 Z" fill="#8db3df"/>
      <path d="M35 80 L45 84 V146 H35 Z" fill="#6fa0d3" opacity="0.9"/>
      <path d="M45 70 L95 92 V146 H45 Z" fill="none" stroke="#111111" stroke-width="7" stroke-linejoin="miter"/>
      <rect x="66" y="102" width="14" height="14" fill="#111111"/>
      <rect x="66" y="126" width="14" height="14" fill="#111111"/>

      <path d="M93 28 L149 0 V110 L93 128 Z" fill="#c4c8c7"/>
      <path d="M105 37 L140 17 V104 L105 115 Z" fill="#eef4f3" opacity="0.54"/>
      <path d="M93 28 L149 0 V110 L93 128 Z" fill="none" stroke="#111111" stroke-width="7" stroke-linejoin="miter"/>
      <rect x="121" y="42" width="14" height="14" fill="#111111"/>
      <rect x="121" y="67" width="14" height="14" fill="#111111"/>

      <path d="M86 120 L170 92 V146 H86 Z" fill="#f5a93a"/>
      <path d="M75 128 L86 124 V146 H75 Z" fill="#dfeceb"/>
      <path d="M170 96 L182 91 V146 H170 Z" fill="#f3a033"/>
      <path d="M86 120 L170 92 V146 H86 Z" fill="none" stroke="#111111" stroke-width="7" stroke-linejoin="miter"/>
      <rect x="126" y="132" width="12" height="12" fill="#111111"/>
      <rect x="144" y="132" width="12" height="12" fill="#111111"/>
      <rect x="126" y="150" width="12" height="12" fill="#111111"/>
      <rect x="144" y="150" width="12" height="12" fill="#111111"/>
    </g>

    <path d="M30 147 C54 160 121 160 146 147" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(220 46)">
    <text x="0" y="86"
      font-family="'Segoe Print'"
      font-size="92"
      font-weight="700"
      letter-spacing="0"
      fill="#1d647b">SELAP</text>
    <path d="M13 88 C78 112 192 112 309 88 C382 73 430 74 488 94" fill="none" stroke="#319abd" stroke-width="4" stroke-linecap="round"/>
    <path d="M500 92 L528 82 L518 109 Z" fill="#319abd"/>
    <text x="4" y="148"
      font-family="'Segoe Print'"
      font-size="22"
      font-weight="700"
      letter-spacing="0"
      fill="#1d647b">Smart Estate Leasing and Approval Platform</text>
  </g>
</svg>
